server:
  port: 8081

spring:
  application:
    name: telemetria

  web:
    locale: pt_BR
    locale-resolver: fixed

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: OT_FLYWAY_HISTORY
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true

cidadao:
  base-url: ${CIDADAO_BASE_URL:http://localhost:5080}
  api-key: ${CIDADAO_API_KEY:}
  timeout: 3s
  reenvio:
    habilitado: true
    intervalo: PT1M

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
